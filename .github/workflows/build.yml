name: ylex release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.path }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: ubuntu-latest,    os: linux,  arch: amd64, path: linux-x86_64, ext: "" }
          - { platform: ubuntu-24.04-arm, os: linux,  arch: arm64, path: linux-arm64,  ext: "" }
          - { platform: macos-latest,     os: darwin, arch: arm64, path: darwin-arm64, ext: "" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Build ylexd
        run: |
          go build -o build/bin/ylexd${{ matrix.ext }} ./cmd/ylexd
          ls -la build/bin

      - uses: actions/upload-artifact@v4
        with:
          name: ylexd-${{ matrix.path }}
          path: build/bin/ylexd${{ matrix.ext }}
          if-no-files-found: error

  release:
    name: Publish release assets
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: false

      - name: Package release assets
        run: |
          set -euo pipefail
          mkdir -p out
          for dir in dist/*/; do
            name=$(basename "$dir")
            bin=$(ls "$dir" | head -1)
            cp "$dir/$bin" "out/$name-$bin"
          done
          cd out
          sha256sum * > checksums.txt
          ls -la

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          prerelease: true
          generate_release_notes: true
